<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EE Exams</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png?v=3">
<link rel="apple-touch-icon" href="icon-192.png?v=3">
<meta name="theme-color" content="#0b2e2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#eef3f2;--card:#fff;--tx:#10231f;--mu:#586b66;--bd:#d3e0dd;--in:#f1f6f5;--ti:#0e5f56;--soft:#dff0ec;--pb:#0e6b61;--gb:#b45309;--wa:#15803d;--nv:#0b2e2a;--gold:#f0b429;--dg:#b42318;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1513;--card:#112220;--tx:#e6f2ef;--mu:#9bb3ad;--bd:#23403b;--in:#16302c;--ti:#7fd8c8;--soft:#173a35;--pb:#1a9082;--gb:#c2650c;--wa:#1a8a47;--nv:#071d1a;--dg:#f26d5f}}
:root[data-theme="dark"]{--bg:#0a1513;--card:#112220;--tx:#e6f2ef;--mu:#9bb3ad;--bd:#23403b;--in:#16302c;--ti:#7fd8c8;--soft:#173a35;--pb:#1a9082;--gb:#c2650c;--wa:#1a8a47;--nv:#071d1a;--dg:#f26d5f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow-x:hidden}

/* header */
.bar{background:var(--nv);color:#fff;padding-bottom:26px}
.wrap{max-width:1040px;margin:0 auto;padding:26px 18px 0}
main{max-width:1040px;margin:-14px auto 0;padding:0 18px 48px}
.ttl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{width:48px;height:48px;border-radius:12px;flex:none}
h1{margin:0;font-size:2rem;font-weight:800;letter-spacing:-.02em}
.st{font-size:.78rem;font-weight:700;background:rgba(255,255,255,.14);color:#b8f5dc;border-radius:999px;padding:3px 10px}
.st:empty{display:none}
.sub{margin:4px 0 0;color:#b7cfca;font-size:.98rem}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.bar .btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:20px}
button,.b{font:inherit;font-weight:600;font-size:.92rem;padding:10px 16px;min-height:42px;border-radius:8px;cursor:pointer;border:1px solid transparent;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.b1{background:var(--card);color:var(--tx);border-color:var(--bd)}
.b2{background:var(--pb);color:#fff}
.b3{background:var(--gb);color:#fff}
.bar .btns button{flex-direction:column;align-items:flex-start;text-align:left;padding:12px 14px;min-height:64px;border-radius:12px;gap:2px}
.bar .btns small{font-weight:400;font-size:.8rem;opacity:.85}
.bar .b1{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.22)}
.bar .b2{background:var(--gold);color:#1d1a0e}
.bar .b3{background:#fff;color:#0b2e2a}

/* filters + tools */
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 6px 20px rgba(11,46,42,.12)}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f span{font-size:.82rem;font-weight:600;color:var(--mu)}
.filters input,.filters select,.tools select{width:100%;min-height:44px;padding:10px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--in);color:var(--tx);font:inherit}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cnt{color:var(--mu);font-size:.9rem;font-weight:600}
.tl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tools select{width:auto;min-height:38px;padding:6px 10px;font-size:.88rem}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--card);color:var(--mu);min-height:38px;padding:6px 12px;font-size:.85rem}
.seg .on{background:var(--pb);color:#fff}
.sb{min-height:38px;padding:6px 12px;font-size:.85rem}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.empty{text-align:center;padding:48px 16px;color:var(--mu)}
.empty h3{margin:8px 0 4px;color:var(--mu)}

/* faculty cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.fm{display:flex;align-items:center;gap:12px;padding-bottom:12px}
.av{flex:none;width:44px;height:44px;border-radius:50%;background:var(--soft);color:var(--ti);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem}
.name{font-weight:800;font-size:1.08rem;line-height:1.2}
.n{color:var(--mu);font-size:.82rem;font-weight:600}
.fm .who{flex:1;min-width:0}
.big{flex:none;text-align:center;background:var(--nv);color:#fff;border-radius:12px;padding:6px 14px;line-height:1}
.big b{display:block;font-size:2.2rem;font-weight:800;color:var(--gold)}
.big span{font-size:.72rem;font-weight:600;opacity:.85}
.bigi{display:inline-flex;align-items:baseline;gap:6px;margin-top:2px}
.bigi b{font-size:1.9rem;font-weight:800;color:var(--ti);line-height:1}
.bigi span{font-size:.8rem;font-weight:600;color:var(--mu)}
.fd{font-weight:600;font-size:.9rem;line-height:1.25;color:var(--mu)}
.dn{display:block;font-size:1.35rem;font-weight:800;color:var(--ti);line-height:1.15}
.fd small{display:block;font-size:.8rem;font-weight:600;color:var(--ti)}
.pick{display:block;margin-bottom:10px}
.pick span{display:block;font-size:.8rem;font-weight:600;color:var(--mu);margin-bottom:3px}
.pick select,.tw select{width:100%;min-height:42px;padding:8px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--in);color:var(--tx);font:inherit;font-size:.9rem}
.tkw{display:flex;flex-direction:column;gap:10px}

/* duty ticket */
.tk{display:grid;grid-template-columns:68px 1fr;border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--card)}
.dt{background:var(--nv);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px;text-align:center;line-height:1.1}
.dt b{font-size:1.7rem;font-weight:800}
.dt span{font-size:.85rem;font-weight:700;color:var(--gold)}
.dt small{font-size:.72rem;opacity:.8;margin-top:2px}
.tb{padding:11px 12px}
.tm{font-weight:800;font-size:1rem}
.ex{font-size:.92rem;margin-top:2px}
.vn{color:var(--mu);font-size:.85rem;margin-bottom:6px}
@keyframes blk{50%{opacity:.3}}
@keyframes sp{0%,100%{box-shadow:inset 0 0 0 0 transparent}50%{box-shadow:inset 0 0 0 60px rgba(240,180,41,.38)}}@keyframes sd{0%{box-shadow:0 0 0 0 rgba(240,180,41,.9)}100%{box-shadow:0 0 0 10px rgba(240,180,41,0)}}@keyframes sh{0%,86%,100%{transform:translateX(0)}90%{transform:translateX(-3px)}94%{transform:translateX(3px)}98%{transform:translateX(-2px)}}
#pendBar{position:sticky;top:0;z-index:8;background:var(--soft);color:var(--tx);border-bottom:2px solid var(--gold);border-left:6px solid var(--gold);font-weight:800;font-size:.95rem;text-align:left;padding:11px 12px;cursor:pointer;display:flex;align-items:center;gap:10px;animation:sp 1.6s ease-in-out infinite,sh 4s ease-in-out infinite}#pendBar[hidden]{display:none}
#pendBar::before{content:'';width:12px;height:12px;border-radius:50%;background:var(--gold);flex:none;animation:sd 1.1s ease-out infinite}
#pendBar b{margin-left:auto;background:var(--gold);color:#3b2a00;font-weight:800;padding:5px 12px;border-radius:999px;white-space:nowrap}
#bBoard.blink{outline:3px solid var(--gold);outline-offset:-3px;animation:sp 1.6s ease-in-out infinite}
.tag.tfl{background:var(--wa);color:#fff}
.pf{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.pf>div{min-width:0}.pf .full{grid-column:1/-1}
.tag{display:inline-block;font-size:.75rem;font-weight:700;background:var(--soft);color:var(--ti);border-radius:999px;padding:3px 10px;white-space:nowrap}
.link{background:none;border:0;color:var(--ti);padding:0;min-height:0;font-size:.85rem;font-weight:600;cursor:pointer}
.dg{color:var(--dg)}
.ac{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.fs{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:7px 11px;min-height:36px;font-size:.82rem}
.fs:hover{background:var(--soft)}

/* table */
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;background:var(--soft);padding:10px 12px;border-bottom:2px solid var(--bd);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--bd);vertical-align:top}
td .ac{margin-top:0}
tr:last-child td{border-bottom:0}
td select{min-width:210px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(5,14,12,.62);display:none;align-items:center;justify-content:center;padding:14px;z-index:9}
.ov.on{display:flex}
.md{background:var(--card);border:1px solid var(--bd);border-radius:16px;width:100%;max-width:540px;max-height:85%;overflow:auto;padding:20px}
.md h2{margin:0 0 12px;font-size:1.25rem;font-weight:800}
.md select,.md input,.md textarea{width:100%;padding:10px;margin:4px 0 12px;border-radius:8px;border:1px solid var(--bd);background:var(--in);color:var(--tx);font:inherit}
.md label{font-size:.85rem;font-weight:600;color:var(--mu)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--bd)}
.act{display:flex;gap:8px;flex-wrap:wrap}
.wa{background:var(--wa);color:#fff;padding:8px 12px;min-height:38px}
.call{background:var(--pb);color:#fff;padding:8px 12px;min-height:38px}
.x{background:var(--in);color:var(--tx);border-color:var(--bd)}
.act .x{padding:8px 12px;min-height:38px}
#cl{width:100%}
textarea.csv{height:100px;font-size:.8rem}
.sm{display:none}
input,select,textarea{font-size:16px}
.fl{display:flex;justify-content:center;gap:22px;margin-top:28px}
.rp{flex-basis:100%;background:var(--soft);border-radius:10px;padding:8px 12px;font-size:.85rem;color:var(--tx)}
.rp b{display:block;color:var(--ti);margin-bottom:2px}
.rp div{padding:2px 0}.rp div span{color:var(--mu);font-size:.8rem}
.rp.none{color:var(--mu)}
.rb{padding:6px 0;border-top:1px solid var(--bd)}
.rb:first-of-type{border-top:0}
.rb span{color:var(--mu);font-size:.78rem}
.rb div{margin-top:2px;white-space:pre-wrap;word-break:break-word}
.rf{flex-basis:100%;display:grid;gap:8px}
.rf select,.rf textarea{margin:0!important}

#adminPanel{margin-top:14px;color:var(--mu);font-size:.88rem}

@media (max-width:640px){
 .wrap{padding:18px 14px 0}
 main{padding:0 12px 110px}
 h1{font-size:1.55rem}
 .bar{padding-bottom:22px}
 .bar .btns{position:fixed;left:0;right:0;bottom:0;z-index:8;display:grid;grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin-top:0;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--nv);border-top:2px solid var(--gold)}
 .bar .btns button{padding:8px 4px;font-size:.78rem;line-height:1.25;border-radius:10px;min-height:54px;align-items:center;text-align:center}
 .lg{display:none}.sm{display:inline}
 .filters{grid-template-columns:1fr 1fr;gap:10px;padding:12px}
 .f:first-child{grid-column:1/-1}
 .grid{grid-template-columns:1fr}
 .fs{min-height:44px}
 .link{padding:8px 0;font-size:.9rem}
 .ov{align-items:flex-end;padding:0}
 .md{max-width:none;border-radius:18px 18px 0 0;max-height:90%;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
 .wa,.call{padding:10px 14px;min-height:44px}
 .row{align-items:flex-start}
}
@media print{
 .bar .btns,.filters,.tools,.fl,#adminPanel,.ac,.ov,#bInst,.pick,td select{display:none!important}
 .bar{background:#fff;color:#000;border-bottom:2px solid #000}.sub{color:#333}.st{display:none}
 body{background:#fff}.box{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){#pendBar,#pendBar::before,#bBoard.blink{animation:none}}</style>
</head>
<body>
<div id="pendBar" hidden><span id="pendTx"></span><b id="pendGo"></b></div>
<header class="bar"><div class="wrap">
    <div class="ttl"><img class="logo" src="icon-192.png?v=3" alt="EE Exams" width="48" height="48" onerror="this.hidden=true"><h1>Duty Lookup</h1><span id="st" class="st"></span></div>
    <p class="sub">Examination duty roster and swap coordination</p>
    <div class="btns">
      <button class="b1" id="bBoard"><span class="lg">📋 See Posted Swaps<br><small>Requests from other staff</small></span><span class="sm">📋<br>Posted</span></button>
      <button class="b2" id="bSwap"><span class="lg">🔄 Swap My Duty<br><small>Post a swap request</small></span><span class="sm">🔄<br>Swap Duty</span></button>
      <button class="b1" id="bStandby"><span class="lg">🆘 Request Standby Invigilator<br><small>Ask Mr. Sharoze Sohail (DEC Member)</small></span><span class="sm">🆘<br>Standby</span></button>
      <button class="b1" id="bInst" hidden>Install app</button>
    </div>
</div></header>
<main>
  <div class="filters">
    <label class="f"><span>Name</span><input id="q" type="search" placeholder="Search by name..." aria-label="Search by name"></label>
    <label class="f"><span>Date</span><select id="d"><option value="">All Dates</option></select></label>
    <label class="f"><span>Time slot</span><select id="t"><option value="">All Time Slots</option></select></label>
    <label class="f"><span>Role</span><select id="r"><option value="">All Roles</option></select></label>
  </div>
  <div class="tools">
    <span class="cnt" id="cnt"></span>
    <div class="tl">
      <select id="s" aria-label="Sort by"><option value="n">Sort: Name</option><option value="d">Sort: Date</option></select>
      <div class="seg"><button id="vC" class="on">Cards</button><button id="vT">Table</button></div>
      <button class="link" id="clr">Clear filters</button>
      <button class="x sb" id="exp">Export CSV</button>
      <button class="x sb" id="prt">Print</button>
    </div>
  </div>
  <div id="list"></div>
  <div class="fl"><button class="link" id="bTheme">Theme: Auto</button><button class="link" id="adminBtn">🔒 Admin</button></div>
  <section id="adminPanel" hidden=""><div style="display:flex;justify-content:space-between;align-items:center"><b>Admin: upload duty data</b><button class="link" id="lock">Lock</button></div>
    <p>CSV header: <code>id,name,phone,date,start,end,exam,venue,role</code> (phone like 923001234567)</p>
    <input type="file" id="file" accept=".csv,text/csv">
    <textarea id="csv" class="csv" style="width:100%;margin-top:8px;background:var(--in);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:8px" placeholder="…or paste CSV here"></textarea>
    <div class="btns" style="margin-top:8px"><button class="b2" id="load">Load data</button><button class="x" id="sample">Load sample</button><button class="x" id="clear">Clear all</button></div>
    <p id="msg"></p>
    <div class="btns" style="margin-top:4px"><button class="b2" id="bSbAdm">🆘 Standby requests</button></div>
    <div style="border-top:1px solid var(--bd);padding-top:10px;margin-top:6px"><b>Admin WhatsApp number</b> <small>(swap approval requests go here)</small>
    <div class="btns" style="margin-top:6px"><input id="admPh" type="tel" placeholder="923001234567" style="flex:1;min-width:160px;min-height:42px;padding:8px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--in);color:var(--tx)"><button class="b2" id="admSave">Save number</button></div><p id="admMsg"></p></div>
  </section>
</main>
<div class="ov" id="ov"><div class="md" id="md"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SAMPLE=`id,name,phone,date,start,end,exam,venue,role
S1,Ahmed Ali,923001110001,2026-10-12,09:00,12:00,Anatomy Paper 1,Hall A,Chief Invigilator
S1,Ahmed Ali,923001110001,2026-10-15,13:00,16:00,Physiology Paper 2,Hall B,Invigilator
S2,Sara Khan,923001110002,2026-10-12,09:00,12:00,Anatomy Paper 1,Hall A,Invigilator
S2,Sara Khan,923001110002,2026-10-19,09:00,11:30,Pharmacology,Room 204,Reliever
S3,Omar Nasser,923001110003,2026-10-14,14:00,17:00,Pathology Paper 1,Hall C,Invigilator
S4,Hina Malik,923001110004,2026-10-16,09:00,12:00,Biochemistry,Hall A,Invigilator`;
const ld=k=>{try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let data=ld('duty2'),swaps=ld('swaps2'),isAdmin=false;
let standbys=[];
const key=r=>r.id||r.name, slot=r=>r.start+'–'+r.end;
const pd=d=>{d=String(d||'').trim();let m;
  if(m=d.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))return new Date(+m[1],m[2]-1,+m[3]);
  if(m=d.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/)){const y=m[3].length===2?2000+ +m[3]:+m[3];return new Date(y,m[2]-1,+m[1])}
  const x=new Date(d);return isNaN(x)?null:x};
const fmt=d=>{const x=pd(d);return x?x.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'}):d};
const longD=d=>{const x=pd(d);return x?{w:x.toLocaleDateString(undefined,{weekday:'long'}),f:x.toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'})}:{w:'',f:d}};
const dparts=d=>{const x=pd(d);return x?{d:x.getDate(),m:x.toLocaleDateString(undefined,{month:'short'}),w:x.toLocaleDateString(undefined,{weekday:'short'})}:null};
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const ph=p=>(p||'').replace(/\D/g,'');
function parse(t){const L=t.trim().split(/\r?\n/).map(l=>l.split(',').map(c=>c.trim()));const h=L.shift().map(x=>x.toLowerCase());
  return L.filter(r=>r.length>2).map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]||''])))}
function staff(){return [...new Map(data.map(r=>[key(r),r])).values()].sort((a,b)=>a.name.localeCompare(b.name))}
function free(duty){const busy=new Set(data.filter(x=>x.date===duty.date&&x.start<duty.end&&duty.start<x.end).map(key));
  return staff().filter(p=>!busy.has(key(p)))}
function acts(p,msg){const n=ph(p.phone),cp=`<button class="b x cp" data-m="${esc(msg)}">Copy message</button>`;return n?`<span class="act"><a class="b wa" target="_blank" rel="noopener" href="https://wa.me/${n}?text=${encodeURIComponent(msg)}">WhatsApp</a><a class="b call" href="tel:+${n}">Call</a>${cp}</span>`:`<span class="act"><small>No phone</small>${cp}</span>`}
const nt=n=>String(n||'').replace(/^\s*(mr|mrs|ms)\.?\s+/i,'').trim();
const swapMsg=(to,me,r)=>`Hi ${nt(to)}, this is ${nt(me)}. Could you please swap or cover my exam duty on ${fmt(r.date)}, ${slot(r)} (${r.exam}, ${r.venue})? Thank you!`;

function fillFilters(){
  const ds=[...new Set(data.map(r=>r.date))].sort(), ts=[...new Set(data.map(slot))].sort(), ro=[...new Set(data.map(r=>r.role).filter(Boolean))].sort();
  const cd=$('d').value,ct=$('t').value,cr=$('r').value;
  $('d').innerHTML='<option value="">All Dates</option>'+ds.map(d=>`<option value="${esc(d)}">${esc(fmt(d))}</option>`).join('');
  $('t').innerHTML='<option value="">All Time Slots</option>'+ts.map(t=>`<option>${esc(t)}</option>`).join('');
  $('r').innerHTML='<option value="">All Roles</option>'+ro.map(x=>`<option>${esc(x)}</option>`).join('');
  $('d').value=cd;$('t').value=ct;$('r').value=cr;
}
let view='c',cur=[],groups=[];
const when=r=>r.date+r.start;
const ac=i=>`<div class="ac"><button class="link fs" data-i="${i}">Swap this duty</button><button class="link fs" data-c="${i}">Add to calendar</button></div>`;
